name: Windows derlemesi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python bağımlılıkları
        run: python -m pip install --upgrade pip pynput pyinstaller

      - name: Motoru derle
        working-directory: uygulama
        run: >
          python -m PyInstaller --noconfirm --onefile --name macropad-engine
          --distpath engine/dist --workpath engine/build --specpath engine
          engine/engine.py

      - name: Motoru doğrula
        working-directory: uygulama
        shell: pwsh
        run: |
          $out = '{"cmd":"quit"}' | & ".\engine\dist\macropad-engine.exe"
          if ($out -notmatch 'ready') { throw "Motor 'ready' yanıtı vermedi: $out" }
          Write-Host "Motor çalışıyor."

      - name: Node bağımlılıkları
        working-directory: uygulama
        run: npm install --no-audit --no-fund

      - name: Paketle
        working-directory: uygulama
        run: npm run dist

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: MacroPad-Windows
          path: uygulama/dist/*.exe

      - name: Sürüme ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uygulama/dist/*.exe
          generate_release_notes: true
